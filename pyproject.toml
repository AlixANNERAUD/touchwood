[project]
name = "touchwood"
version = "0.1.0"
description = "Tap localisation on a table with TinyML on Arduino Nano 33 BLE Sense"
authors = [
    { name = "Alix ANNERAUD", email = "alix@anneraud.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyserial>=3.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "tensorflow-model-optimization>=0.8.1",
    "tf-keras>=2.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
